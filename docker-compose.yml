services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: nevp-stock-backend:v2.3
    container_name: nevp-stock-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5555}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-corporate_stock_manager_secure_jwt_2026}
      - DB_PATH=/app/data/stock_manager.db
    volumes:
      - stock_data:/app/data
    networks:
      stock-net:
        aliases:
          - backend
          - nevp-stock-backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: nevp-stock-frontend:v2.1
    container_name: nevp-stock-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    depends_on:
      - backend
    networks:
      - stock-net

volumes:
  stock_data:

networks:
  stock-net:
    driver: bridge
